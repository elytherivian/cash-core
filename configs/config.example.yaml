app:
  environment: local
  name: cash
  version: dev

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  read_header_timeout: 5s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s
  allowed_origins:
    - "*"

database:
  host: localhost
  port: 5432
  name: cash
  user: cash
  password: cash
  ssl_mode: disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  connect_timeout: 5s

log:
  level: debug
  format: text

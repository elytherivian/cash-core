services:
  api:
    profiles: ["app"]
    image: ${APP_IMAGE:-elytherivian/cash-core}:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-cash}
      APP_VERSION: ${APP_VERSION:-local}
      API_TIMEZONE: ${API_TIMEZONE:-Asia/Shanghai}
      JWT_ISSUER: ${JWT_ISSUER:-cash-core}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-change-me}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-720h}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
      DB_PATH: /data/cash.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Shanghai}
    ports:
      # 仅用于本机调试。生产流量应只经由 caddy 服务进入 API。
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-dash-rn.elytherivian.top}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-cash}
      APP_VERSION: ${APP_VERSION:-local}
      API_TIMEZONE: ${API_TIMEZONE:-Asia/Shanghai}
      JWT_ISSUER: ${JWT_ISSUER:-cash-core}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-change-me}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-720h}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
      DB_PATH: /data/cash.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Shanghai}
    expose:
      - "8080"
    volumes:
      - ${SQLITE_DATA_DIR:-../data}:/data
    networks:
      caddy_proxy:
        aliases:
          - cash-core-api
    restart: unless-stopped

networks:
  caddy_proxy:
    external: true
    name: ${CADDY_PROXY_NETWORK:-caddy_proxy}
